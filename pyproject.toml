[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-bgev"
version = "0.1.0"
description = "Minimal JAX operations for the blended GEV distribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jax>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
